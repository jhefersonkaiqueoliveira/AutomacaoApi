name: API tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        working-directory: api
        run: npm ci
      - name: Executar testes com relatorio
        working-directory: api
        run: npm run test:report
      - name: Gerar relatorio HTML
        if: always()
        working-directory: api
        run: |
          if ls cypress/reports/mochawesome/*.json 1> /dev/null 2>&1; then
            npm run report:merge
            npm run report:html
          else
            echo "Nenhum arquivo JSON de relatorio foi gerado."
          fi
      - name: Publicar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: api/cypress/reports/html
